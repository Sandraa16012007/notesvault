<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>NotesVault - Discussion Panel</title>

    <!-- Favicon -->
    <link
      rel="icon"
      href="../assets/index/images/favicon.png"
      type="image/x-icon"
    />

    <!-- Font Awesome -->
    <link
      rel="stylesheet"
      href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css"
    />

    <!-- CSS -->
    <link rel="stylesheet" href="../styling/discussion.css" />
    <link rel="stylesheet" href="../styling/base.css" />
    <link rel="stylesheet" href="../styling/variables.css" />
    <link rel="stylesheet" href="../styling/discussion-new-post.css" />

  </head>

  <body>

    <!-- Header -->
    <div id="header-placeholder"></div>

    <main class="discussion-panel">

        <!-- Layout -->

        <div class="sidebar-container">
        <!-- Sidebar -->
            <div class="sidebar">
                <nav class="menu">
                    <a href="#" class="menu-item">
                    <img class="icon" src="../assets/discussion/home-icon.png" alt="Home Icon" class="home-link">
                    Home
                    </a>
                    <a href="#" class="menu-item">
                    <img class="icon" src="../assets/discussion/discussion-icon.png" alt="Discussion Icon" class="your-posts-link">
                    Your Posts
                    </a>
                    <a href="#" class="menu-item">
                    <img class="icon" src="../assets/discussion/tag-grey-icon.png" alt="Tag Icon" class="saved-link">
                    Saved
                    </a>
                </nav>

                <div class="discussions">
                    <div class="discussion-header">
                        <span>Current Discussions</span>
                    </div>
                    <div class="discussion-list">
                    <a href="#" class="discussion-item">
                        <img class="icon" src="../assets/discussion/tech-updates-icon.png" alt="Tech updates Icon">
                        <div class="discussion-item-details">
                            <p class="discussion-name">Tech Updates</p>
                            <p class="discussion-members">118 members</p>
                        </div>
                    </a>
                    <a href="#" class="discussion-item">
                        <img class="icon" src="../assets/discussion/data-struc-icon.png" alt="Data Structures Icon">
                        <div class="discussion-item-details">
                            <p class="discussion-name">Data Structures</p>
                            <p class="discussion-members">49 members</p>
                        </div>
                    </a>
                    </div>
                    <button class="join-new">Join a new discussion</button>
                </div>
            </div>
        </div>

        <!-- Main Content -->
        <div class="main">

                <div class="back-banner">
                    <div class="back-link-button">
                        <img src="../assets/discussion/left-arrow-icon.png" alt="Left arrow icon">
                    </div>
                    <p class="back-link">Back to posts</p>
                </div>

                <div class="card">
                    <p>Add new post</p>
                    <div class="card-header">
                        <div class="avatar"></div>
                        <div style="flex:1;">
                            <p id="username">Sandra16012007</p>
                        </div>
                    </div>
                    <form>
                        <input type="text" id="post-title" name="post-title" placeholder="Write Post Title">
                        <textarea id="post-content" name="post-content" rows="4" cols="50" placeholder="Write your post here..."></textarea>
                        <p id="tag-title">Tags</p>
                        <p id="tag-content">Choose relevant tags</p>
                        <div class="tags-container">
                            <div class="tag">Tech Updates</div>
                            <div class="tag">Data Structures</div>
                            <div class="tag">Programming</div>
                            <div class="tag">Algorithms</div>
                            <div class="tag">Web Development</div>
                            <div class="tag">Machine Learning</div>
                        </div>
                    </form>
                    <div class="form-buttons">
                        <button class="cancel-button">Cancel</button>
                        <button class="submit-button">Submit</button>
                    </div>  
                </div>

                

            </div>

            

    </main>
    <!-- Footer -->
    <div id="footer-placeholder"></div>

    <!-- JavaScript -->
    <script src="../scripts/script.js" defer></script>
    <script src="../scripts/discussion.js" defer></script>

</body>
</html>
